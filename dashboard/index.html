<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2eee3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home Sensing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect x='4' y='4' width='88' height='88' rx='17' fill='%23fbf9f2' stroke='%2316140f' stroke-width='7'/><rect x='21' y='48' width='14' height='27' fill='%23a9d18e' stroke='%2316140f' stroke-width='3'/><rect x='41' y='33' width='14' height='42' fill='%23f2c14e' stroke='%2316140f' stroke-width='3'/><rect x='61' y='20' width='14' height='55' fill='%2316140f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Tiny5&display=swap">
<style>
  /* Sage, mustard and black mean status, and nothing else. Selection uses shape: a shadow, an arrow, an open chart. */
  :root {
    --paper: #f2eee3; --card: #fbf9f2; --ink: #16140f; --muted: #5f5a4d;
    --good: #a9d18e; --fair: #f2c14e; --poor: #16140f; --panel: #2a2925;
    --body: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 var(--body); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1, h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 700; line-height: 1.1; }
  h1 { font-size: 28px; }
  h2 { font-size: 22px; }
  h1::before, h2::before { content: ""; width: 10px; height: 10px; background: var(--ink); flex: none; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button, select { background: var(--card); border: 2px solid var(--ink); border-radius: 22px; min-height: 44px; padding: 0 14px; font-weight: 700; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .muted { color: var(--muted); font-size: 14px; }
  .top-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { font: 500 13px var(--mono); display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; background: var(--ink); }
  .status.stale .dot { background: transparent; border: 2px solid var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side, .detail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .detail { display: none; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 390px minmax(0, 1fr); gap: 28px; align-items: start; }
    .detail { display: flex; }
  }

  .twin { position: relative; background: var(--panel); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); padding: 20px; display: flex; justify-content: center; }
  .twin::after { content: ""; position: absolute; top: 0; right: 0; width: 72px; height: 12px; border-top-right-radius: 10px; background: repeating-conic-gradient(#16140f 0 25%, #f2c14e 0 50%) 0 0 / 8px 8px; }
  .screen { width: 220px; height: 220px; background: #e6e5dc; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
  .screen-top { display: flex; justify-content: center; align-items: center; gap: 90px; height: 25px; flex: none; border-bottom: 2px solid var(--ink); }
  .screen-temp { font-size: 48px; font-weight: 700; line-height: 1; text-align: center; padding: 10px 0 8px; margin: 0 10px; border-bottom: 2px solid var(--ink); }
  .screen-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); flex-grow: 1; align-items: center; text-align: center; }
  .screen-row > div + div { border-left: 2px solid var(--ink); }
  .screen-row.single { grid-template-columns: minmax(0, 1fr); }
  .screen-row b { display: block; font-size: 30px; line-height: 1.1; }
  .screen-air { font-size: 20px; font-weight: 700; text-align: center; padding: 6px 0 11px; flex: none; }
  .screen-air.poor { background: var(--ink); color: #e6e5dc; }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; min-height: 62px; padding: 8px 12px; text-align: left; border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); font-weight: 500; }
  .row.on { box-shadow: 5px 5px 0 var(--ink); }
  .row .text { min-width: 0; }
  .row .head { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 8px; }
  .row .label { font-size: 17px; font-weight: 700; }
  .row .sub { display: block; font: 400 13px var(--mono); margin-top: 3px; }
  .row .end { display: flex; align-items: center; gap: 8px; flex: none; }
  .row .value { font: 500 28px/1 var(--mono); letter-spacing: -0.02em; white-space: nowrap; }
  .row .mark { font: 700 16px var(--mono); width: 12px; }
  .chip { font-size: 13px; font-weight: 700; padding: 1px 8px; border: 2px solid var(--ink); border-radius: 5px; }
  .good { background: var(--good); }
  .fair { background: var(--fair); }
  .poor { background: var(--poor); color: var(--card); }

  .box { background: var(--card); border: 2px solid var(--ink); border-radius: 10px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .ranges { display: flex; gap: 6px; flex-wrap: wrap; }
  .ranges button { min-height: 40px; padding: 0 12px; font-size: 14px; }
  .ranges button.on, .tabs button.on, .tools button.on { background: var(--ink); color: var(--card); }
  .readout { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 14px var(--mono); min-height: 20px; }
  .readout b { font-weight: 700; }
  .plot-wrap { display: flex; gap: 6px; min-width: 0; --plot: 180px; }
  @media (min-width: 900px) { .plot-wrap { --plot: 360px; } }
  .y-axis { display: flex; flex-direction: column; justify-content: space-between; height: var(--plot); width: 40px; flex: none; text-align: right; font: 400 12px/1 var(--mono); color: var(--muted); }
  .plot { position: relative; flex: 1 1 0; min-width: 0; height: var(--plot); border-bottom: 2px solid var(--ink); display: flex; align-items: flex-end; gap: 2px; }
  .bar { flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; padding: 0; border: 0; border-radius: 0; background: transparent; display: flex; align-items: flex-end; }
  .bar span { display: block; width: 100%; }
  .bar.picked span { outline: 2px solid var(--ink); }
  .limit { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink); pointer-events: none; }
  .limit span { position: absolute; right: 0; top: -15px; font: 500 11px var(--mono); background: var(--card); padding: 0 2px; }
  .x-axis { display: flex; justify-content: space-between; padding-left: 46px; font: 400 12px var(--mono); color: var(--muted); }
  .chart-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; font-weight: 700; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border: 2px solid var(--ink); }
  #stats { font: 500 13px var(--mono); margin: 0; }

  .panel { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); padding: 24px; max-width: 420px; margin: 12vh auto 0; }
  .panel h1 { margin-bottom: 8px; }
  .panel p { margin: 8px 0 0; }
  .panel input { width: 100%; min-height: 46px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); margin: 12px 0; }
  .panel button { width: 100%; background: var(--ink); color: var(--card); }
  .msg { font-size: 14px; margin: 12px 0 0; }
  .msg.error { font-weight: 700; }
  .banner { background: var(--card); border: 2px solid var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 700; margin-bottom: 16px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .tabs button { min-height: 40px; font-size: 15px; }
  .narrow { max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  .narrow p { margin: 0; }
  .twin.hub { padding: 16px; }
  .paper { display: block; width: 100%; height: auto; aspect-ratio: 250 / 92; background: #e6e5dc; border-radius: 4px; image-rendering: pixelated; }
  #msg-canvas { touch-action: none; cursor: crosshair; }
  textarea, .field input { width: 100%; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); }
  textarea { display: block; resize: vertical; min-height: 68px; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tools button { min-height: 40px; padding: 0 12px; font-size: 14px; }
  .field { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .field input { width: 9em; min-height: 40px; padding: 0 12px; }
  .send { background: var(--ink); color: var(--card); }
  button:disabled { opacity: 0.5; cursor: default; }
  .item { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); padding: 10px 12px; }
  .item .paper { width: 125px; flex: none; border: 2px solid var(--ink); }
  .item .text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .item .head { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 8px; }
  .item .label { font-size: 17px; font-weight: 700; }
  .item .sub { font: 400 13px var(--mono); }
  .item button { min-height: 36px; padding: 0 12px; font-size: 14px; margin-top: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <section id="login" class="panel" hidden>
    <h1>Home Sensing</h1>
    <p class="muted">Enter your email and we'll send you a sign-in link.</p>
    <form id="login-form">
      <input id="email" type="email" placeholder="name@example.com" aria-label="Email" autocomplete="email" required>
      <button type="submit">Send sign-in link</button>
    </form>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="app" hidden>
    <header>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h1 id="room-title">Home Sensing</h1>
        <select id="device" aria-label="Room" hidden></select>
      </div>
      <div class="top-right">
        <span id="status" class="status"><span class="dot"></span><span id="status-text">Loading…</span></span>
        <button id="signout">Sign out</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <nav class="tabs" aria-label="Sections">
      <button data-view="rooms" class="on">Rooms</button>
      <button data-view="message">Message</button>
      <button data-view="devices">Devices</button>
    </nav>

    <div id="view-rooms">
    <div class="layout">
      <div class="side">
        <!-- A copy of the node's e-paper screen, drawn from the latest reading -->
        <div class="twin">
          <div class="screen" role="img" id="screen" aria-label="Latest reading, as on the device">
            <div class="screen-top">
              <svg width="20" height="16" viewBox="0 0 24 19" fill="none" stroke="#16140f" stroke-width="2.5" aria-hidden="true">
                <path d="M2 7 A14 14 0 0 1 22 7"/><path d="M6.5 11.5 A8 8 0 0 1 17.5 11.5"/><rect x="10.5" y="15" width="3" height="3" fill="#16140f" stroke="none"/>
                <g id="t-offline" hidden><path d="M2 18 L22 1" stroke="#e6e5dc" stroke-width="5"/><path d="M2 18 L22 1"/></g>
              </svg>
              <svg id="t-batt" width="28" height="14" viewBox="0 0 28 14" fill="none" stroke="#16140f" stroke-width="2" aria-hidden="true">
                <rect x="1" y="1" width="23" height="12"/><rect x="25" y="4" width="3" height="6" fill="#16140f" stroke="none"/>
                <rect id="t-fill" x="3" y="3" width="0" height="8" fill="#16140f" stroke="none"/>
                <path id="t-bolt" d="M15 2 L9 8 H13 L11 12 L17 6 H13 Z" fill="#16140f" stroke="none" hidden/>
              </svg>
            </div>
            <div class="screen-temp" id="t-temp">--</div>
            <div class="screen-row" id="t-row">
              <div><span id="t-hum-word">--</span><b id="t-hum">--</b></div>
              <div id="t-co2-cell"><span>CO2</span><b id="t-co2">--</b></div>
            </div>
            <div class="screen-air" id="t-air">Air --</div>
          </div>
        </div>

        <div class="rows" id="rows"></div>
      </div>

      <div class="detail" id="detail">
        <h2 id="chart-title">CO2</h2>
      </div>
    </div>

    <!-- Moved under the selected row on a phone, and into the right column on a wide screen -->
    <div class="box" id="chart-box">
      <div class="ranges">
        <button data-range="24h" class="on">24 h</button>
        <button data-range="7d">7 days</button>
        <button data-range="30d">30 days</button>
        <button data-range="1y">1 year</button>
      </div>
      <div class="readout"><span id="readout-time"></span><b id="readout-value"></b></div>
      <div class="plot-wrap">
        <div class="y-axis"><span id="y-hi"></span><span id="y-mid"></span><span id="y-lo"></span></div>
        <div class="plot" id="plot"></div>
      </div>
      <div class="x-axis"><span id="x-start"></span><span id="x-mid"></span><span>Now</span></div>
      <div class="chart-foot">
        <div class="legend" id="legend"></div>
        <p id="stats"></p>
      </div>
    </div>
    </div>

    <div id="view-message" class="narrow" hidden>
      <div class="box">
        <!-- The canvas is the 250 x 92 area under the Hub's top bar, pixel for pixel -->
        <div class="twin hub"><canvas id="msg-canvas" class="paper" width="250" height="92" aria-label="Message as the Hub will show it. Draw here with a finger or the mouse."></canvas></div>
        <textarea id="msg-text" rows="2" maxlength="140" placeholder="Write here, draw on the screen above" aria-label="Message text"></textarea>
        <div class="tools">
          <button data-font="hand" class="on">Handwriting</button>
          <button data-font="print">Print</button>
        </div>
        <div class="tools">
          <button data-tool="pen" class="on">Pen</button>
          <button data-tool="erase">Eraser</button>
          <button id="msg-undo">Undo</button>
          <button id="msg-clear">Clear</button>
        </div>
        <label class="field">Signed <input id="msg-name" maxlength="12" placeholder="Your name" autocomplete="given-name"></label>
        <button id="msg-send" class="send">Send to the Hub</button>
        <p id="msg-status" class="msg" role="status"></p>
        <p class="muted">The Hub shows exactly these pixels. It picks a new message up the next time it wakes: a few minutes by day, up to half an hour at night.</p>
      </div>
      <h2>Sent</h2>
      <div class="rows" id="msg-list"></div>
    </div>

    <div id="view-devices" class="narrow" hidden>
      <div class="rows" id="device-list"></div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
// Public by design: access to the data is enforced by row-level security in Supabase.
const SUPABASE_URL = "https://kaldnqbfgbglhvoummxg.supabase.co";
const SUPABASE_KEY = "sb_publishable_aTP3lF5WX0hwv7i_otntRA_c_Mtm29V";

// Each reading: its chart scale, limit lines, and how a value is rated.
// CO2 and humidity use the same limits as the firmware.
const METRICS = {
  co2_ppm: {
    label: "CO2", unit: "", dec: 0, lo: 300, hi: 1600, limits: [[800, "Fair"], [1200, "Poor"]],
    rate: (v) => v < 800 ? ["good", "Good"] : v < 1200 ? ["fair", "Fair"] : ["poor", "Poor"],
    legend: [["good", "Good"], ["fair", "Fair"], ["poor", "Poor"]],
  },
  temp_c: {
    label: "Temperature", unit: "°", dec: 1, lo: 14, hi: 30, limits: [[18, "18°"], [26, "26°"]],
    rate: (v) => v < 18 ? ["fair", "Cool"] : v > 26 ? ["fair", "Warm"] : ["good", "Comfortable"],
    legend: [["good", "Comfortable"], ["fair", "Cool or warm"]],
  },
  humidity: {
    label: "Humidity", unit: "%", dec: 0, lo: 20, hi: 80, limits: [[40, "40%"], [60, "60%"]],
    rate: (v) => v < 40 ? ["fair", "Dry"] : v > 60 ? ["fair", "Humid"] : ["good", "OK"],
    legend: [["good", "OK"], ["fair", "Dry or humid"]],
  },
  battery_pct: {
    label: "Battery", unit: "%", dec: 0, lo: 0, hi: 100, limits: [[15, "15%"], [30, "30%"]],
    rate: (v) => v < 15 ? ["poor", "Charge now"] : v < 30 ? ["fair", "Low"] : ["good", "OK"],
    legend: [["good", "OK"], ["fair", "Low"], ["poor", "Charge now"]],
  },
};
// Bucket sizes give each range about 30-50 bars
const RANGES = {
  "24h": { ms: 864e5,       bucket: "30 minutes", bucketMs: 18e5,    start: "24 h ago",   mid: "12 h ago" },
  "7d":  { ms: 7 * 864e5,   bucket: "4 hours",    bucketMs: 144e5,   start: "7 days ago", mid: "3.5 days ago" },
  "30d": { ms: 30 * 864e5,  bucket: "1 day",      bucketMs: 864e5,   start: "30 days ago", mid: "15 days ago" },
  "1y":  { ms: 365 * 864e5, bucket: "7 days",     bucketMs: 6048e5,  start: "1 year ago", mid: "6 months ago" },
};
const BUCKET_ORIGIN = Date.UTC(2000, 0, 1);  // readings_bucketed counts its buckets from here
const OFFLINE_AFTER_MS = 90 * 60e3;  // the devices report at least every 30 minutes; the Hub also calls data stale after 90
const KIND = { node: [0, "Sensor"], hub: [1, "Hub"], legacy: [2, "Old sensor"] };  // order in the lists, and a word for people
const VIEW_TITLES = { message: "Message", devices: "Devices" };
const HUB_BATTERY_LOW_V = 3.5;       // BATTERY_LOW_V in firmware/hub/hub.ino
const REFRESH_MS = 60e3;

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const state = { view: "rooms", device: null, devices: [], names: {}, metric: "co2_ppm", range: "24h", rows: [], picked: null, started: false };
const wide = window.matchMedia("(min-width: 900px)");

// ---------- Auth ----------

db.auth.onAuthStateChange((_event, session) => {
  if (session) {
    $("login").hidden = true;
    $("app").hidden = false;
    if (!state.started) { state.started = true; startApp(); }
  } else {
    $("app").hidden = true;
    $("login").hidden = false;
  }
});

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("login-msg");
  msg.className = "msg";
  msg.textContent = "Sending…";
  const { error } = await db.auth.signInWithOtp({
    email: $("email").value.trim(),
    options: { emailRedirectTo: location.origin + location.pathname },
  });
  if (error) {
    msg.className = "msg error";
    msg.textContent = error.message;
  } else {
    msg.textContent = "Check your inbox and open the link on this device.";
  }
});

$("signout").addEventListener("click", async () => {
  await db.auth.signOut();
  location.reload();
});

// ---------- Data ----------

async function loadDevices() {
  const { data, error } = await db.from("devices").select("id, name, kind, last_seen_at, battery_v, rssi_dbm, fw_version, awake_ms");
  if (error) throw error;
  const rank = (d) => (KIND[d.kind] || KIND.legacy)[0];
  data.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  state.devices = data;
  state.names = Object.fromEntries(data.map((d) => [d.id, d.name]));
}

async function startApp() {
  try {
    await loadDevices();
  } catch (err) {
    return showBanner("Couldn't load devices: " + (err.message || err));
  }
  if (!state.devices.length) {
    const { data } = await db.auth.getUser();
    return showBanner(`Signed in as ${data.user?.email}, but this account has no access. Add the email to the viewers table in Supabase.`);
  }

  // The room with the CO2 sensor comes first, a retired device last
  const select = $("device");
  select.innerHTML = state.devices.map((d) => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("");
  select.addEventListener("change", () => { state.device = select.value; state.picked = null; refresh(); });
  state.device = state.devices[0].id;

  initControls();
  initEditor();
  showView("rooms");
  setInterval(refresh, REFRESH_MS);
}

function showView(view) {
  state.view = view;
  for (const v of ["rooms", "message", "devices"]) $("view-" + v).hidden = v !== view;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  $("device").hidden = view !== "rooms" || state.devices.length < 2;
  $("status").hidden = view !== "rooms";
  $("room-title").textContent = VIEW_TITLES[view] || state.names[state.device];
  if (view === "message") openEditor();
  refresh();
}

async function bucketed(rangeKey) {
  const r = RANGES[rangeKey];
  const to = new Date();
  const { data, error } = await db.rpc("readings_bucketed", {
    p_device_id: state.device,
    p_from: new Date(to - r.ms).toISOString(),
    p_to: to.toISOString(),
    p_bucket: r.bucket,
  });
  if (error) throw error;
  return data;
}

async function refresh() {
  try {
    if (state.view === "rooms") {
      await refreshRoom();
    } else {
      await loadDevices();
      if (state.view === "message") await refreshMessages();
      else renderDevices();
    }
    $("banner").hidden = true;
  } catch (err) {
    showBanner("Couldn't load: " + (err.message || err));
  }
}

async function refreshRoom() {
  const [latestRes, day, rows] = await Promise.all([
    db.from("readings").select("ts, temp_c, humidity, co2_ppm, battery_v, battery_pct, charging")
      .eq("device_id", state.device).order("ts", { ascending: false }).limit(1),
    bucketed("24h"),
    state.range === "24h" ? null : bucketed(state.range),
  ]);
  if (latestRes.error) throw latestRes.error;
  if (state.view !== "rooms") return;  // the tab changed while this was loading
  $("room-title").textContent = state.names[state.device];
  renderRows(latestRes.data[0], day);
  state.rows = rows || day;
  renderChart();
}

// ---------- Rendering ----------

const has = (v) => v !== null && v !== undefined;
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");

function fmt(v, metric) {
  if (!has(v)) return "--";
  const m = METRICS[metric];
  return Number(v).toFixed(m.dec) + m.unit;
}

function ago(ms) {
  const s = Math.round(ms / 1000);
  if (s < 90) return `${s} s ago`;
  const m = Math.round(s / 60);
  if (m < 90) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 36 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}

function renderRows(latest, day) {
  // A room only gets the rows its device measures: the Hub has no CO2 sensor, the Node no battery reading
  const measured = Object.keys(METRICS).filter((key) => has(latest?.[key]) || day.some((r) => has(r[key])));
  const keys = measured.length ? measured : Object.keys(METRICS);
  if (!keys.includes(state.metric)) state.metric = keys[0];
  const html = keys.map((key) => {
    const m = METRICS[key];
    const value = latest?.[key];
    let chip = has(value) ? m.rate(value) : null;
    let sub = "No data in the last 24 h";
    const values = day.map((r) => r[key]).filter(has);
    if (values.length) sub = `24 h: ${fmt(Math.min(...values), key)} – ${fmt(Math.max(...values), key)}`;
    if (key === "co2_ppm" && chip?.[0] === "poor") sub = "Open the window";
    if (key === "battery_pct") {
      if (latest?.charging) chip = ["good", "Charging"];
      if (has(latest?.battery_v)) sub = Number(latest.battery_v).toFixed(2) + " V";
    }
    const on = key === state.metric;
    const mark = wide.matches ? (on ? "▸" : "") : (on ? "▾" : "▸");
    return `<button class="row${on ? " on" : ""}" data-metric="${key}" aria-expanded="${on}">
      <span class="text">
        <span class="head"><span class="label">${m.label}</span>${chip ? `<span class="chip ${chip[0]}">${chip[1]}</span>` : ""}</span>
        <span class="sub">${sub}</span>
      </span>
      <span class="end"><span class="value">${has(value) ? fmt(value, key) : "--"}</span><span class="mark" aria-hidden="true">${mark}</span></span>
    </button>`;
  }).join("");
  // The chart may be sitting inside the rows, so it is taken out before they are replaced
  $("view-rooms").append($("chart-box"));
  $("rows").innerHTML = html;
  placeChart();

  const status = $("status");
  if (!latest) {
    status.className = "status stale";
    $("status-text").textContent = "No readings yet";
    renderScreen(null, true, true);
    return;
  }
  const age = Date.now() - new Date(latest.ts);
  const stale = age > OFFLINE_AFTER_MS;
  status.className = stale ? "status stale" : "status";
  $("status-text").textContent = (stale ? "Offline · last seen " : "Updated ") + ago(age);
  renderScreen(latest, stale, keys.includes("co2_ppm"));
}

function placeChart() {
  const box = $("chart-box");
  if (wide.matches) $("detail").append(box);
  else $("rows").querySelector(`[data-metric="${state.metric}"]`).after(box);
}

// withCo2 is false for a room whose device has no CO2 sensor: its screen then leaves that part out
function renderScreen(r, stale, withCo2) {
  $("t-row").classList.toggle("single", !withCo2);
  $("t-co2-cell").hidden = !withCo2;
  $("t-air").hidden = !withCo2;
  $("t-temp").textContent = has(r?.temp_c) ? Number(r.temp_c).toFixed(1) + "°C" : "--";
  $("t-hum").textContent = has(r?.humidity) ? Math.round(r.humidity) + "%" : "--";
  $("t-hum-word").textContent = has(r?.humidity) ? METRICS.humidity.rate(r.humidity)[1] : "--";
  $("t-co2").textContent = has(r?.co2_ppm) ? Math.round(r.co2_ppm) : "--";

  const level = has(r?.co2_ppm) ? METRICS.co2_ppm.rate(r.co2_ppm)[0] : null;
  const air = $("t-air");
  air.textContent = level === "poor" ? "Open window" : level ? "Air " + level : "Air --";
  air.classList.toggle("poor", level === "poor");

  $("t-offline").toggleAttribute("hidden", !stale);
  $("t-batt").toggleAttribute("hidden", !r?.charging && !has(r?.battery_pct));
  $("t-bolt").toggleAttribute("hidden", !r?.charging);
  $("t-fill").setAttribute("width", r?.charging || !has(r?.battery_pct) ? 0 : 19 * r.battery_pct / 100);
  $("screen").setAttribute("aria-label", `Latest reading: ${$("t-temp").textContent}, humidity ${$("t-hum").textContent}` + (withCo2 ? `, CO2 ${$("t-co2").textContent}, ${air.textContent}` : ""));
}

function initControls() {
  document.querySelectorAll(".tabs button").forEach((btn) => btn.addEventListener("click", () => showView(btn.dataset.view)));
  $("rows").addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    state.metric = row.dataset.metric;
    state.picked = null;
    refresh();
  });
  document.querySelectorAll(".ranges button").forEach((btn) => btn.addEventListener("click", () => {
    state.range = btn.dataset.range;
    state.picked = null;
    document.querySelectorAll(".ranges button").forEach((b) => b.classList.toggle("on", b === btn));
    refresh();
  }));
  $("plot").addEventListener("click", (e) => {
    const bar = e.target.closest(".bar");
    if (!bar) return;
    state.picked = Number(bar.dataset.i);
    renderChart();
  });
  wide.addEventListener("change", refresh);
}

// One slot per bucket of the range, oldest first; hours with no data stay as empty slots
function chartSlots() {
  const r = RANGES[state.range];
  const now = Date.now();
  const first = BUCKET_ORIGIN + Math.floor((now - r.ms - BUCKET_ORIGIN) / r.bucketMs) * r.bucketMs;
  const count = Math.floor((now - first) / r.bucketMs) + 1;
  const slots = Array.from({ length: count }, (_, i) => ({ t: first + i * r.bucketMs, v: null }));
  for (const row of state.rows) {
    const i = Math.floor((new Date(row.ts).getTime() - first) / r.bucketMs);
    if (slots[i]) slots[i].v = row[state.metric];
  }
  return slots;
}

function whenLabel(t) {
  const ms = Date.now() - t;
  return ms < RANGES[state.range].bucketMs ? "Now" : ago(ms);
}

function renderChart() {
  const m = METRICS[state.metric];
  const r = RANGES[state.range];
  $("chart-title").textContent = m.label;
  $("x-start").textContent = r.start;
  $("x-mid").textContent = r.mid;

  const slots = chartSlots();
  const known = slots.filter((s) => has(s.v));
  const lo = Math.min(m.lo, ...known.map((s) => s.v));
  const hi = Math.max(m.hi, ...known.map((s) => s.v));
  const label = (v) => Number(v).toFixed(0) + m.unit;
  $("y-hi").textContent = label(hi);
  $("y-mid").textContent = label((hi + lo) / 2);
  $("y-lo").textContent = label(lo);

  if (state.picked === null || !has(slots[state.picked]?.v)) {
    state.picked = known.length ? slots.lastIndexOf(known[known.length - 1]) : null;
  }

  const height = (v) => Math.max(1, (v - lo) / (hi - lo) * 100);
  const bars = slots.map((s, i) => {
    if (!has(s.v)) return `<div class="bar" aria-hidden="true"></div>`;
    const [level, word] = m.rate(s.v);
    const text = `${whenLabel(s.t)}: ${fmt(s.v, state.metric)}, ${word}`;
    return `<button class="bar${i === state.picked ? " picked" : ""}" data-i="${i}" aria-label="${text}"><span class="${level}" style="height:${height(s.v).toFixed(1)}%"></span></button>`;
  }).join("");
  const limits = m.limits.map(([v, text]) =>
    `<div class="limit" style="top:${(100 - (v - lo) / (hi - lo) * 100).toFixed(1)}%"><span>${text}</span></div>`).join("");
  $("plot").innerHTML = bars + limits;

  $("legend").innerHTML = m.legend.map(([level, text]) => `<span><i class="${level}"></i>${text}</span>`).join("");

  if (!known.length) {
    $("readout-time").textContent = "No data for this range yet";
    $("readout-value").textContent = "";
    $("stats").textContent = "";
    return;
  }
  const picked = slots[state.picked];
  $("readout-time").textContent = whenLabel(picked.t);
  $("readout-value").textContent = `${fmt(picked.v, state.metric)} · ${m.rate(picked.v)[1]}`;
  const v = known.map((s) => s.v);
  const avg = v.reduce((a, b) => a + b, 0) / v.length;
  $("stats").textContent = `MIN ${fmt(Math.min(...v), state.metric)} · AVG ${fmt(avg, state.metric)} · MAX ${fmt(Math.max(...v), state.metric)}`;
}

// ---------- Devices ----------

function clock(ts) {
  const d = new Date(ts);
  const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  if (d.toDateString() === new Date().toDateString()) return time;
  return d.toLocaleDateString([], { day: "numeric", month: "short" }) + " " + time;
}

function renderDevices() {
  $("device-list").innerHTML = state.devices.map((d) => {
    const lines = [];
    let chip = "";
    if (has(d.last_seen_at)) {
      const age = Date.now() - new Date(d.last_seen_at);
      const offline = age > OFFLINE_AFTER_MS;
      chip = `<span class="chip ${offline ? "poor" : "good"}">${offline ? "Offline" : "Online"}</span>`;
      lines.push(`Last contact ${ago(age)}`);
      if (has(d.battery_v)) {
        const low = d.battery_v < HUB_BATTERY_LOW_V;
        if (low && !offline) chip = `<span class="chip fair">Battery low</span>`;
        lines.push(`Battery ${Number(d.battery_v).toFixed(2)} V`);
      } else {
        lines.push("Battery not measured");
      }
      if (has(d.rssi_dbm)) lines.push(`Wi-Fi ${d.rssi_dbm} dBm · ${d.rssi_dbm >= -60 ? "strong" : d.rssi_dbm >= -72 ? "fine" : "weak"}`);
      if (has(d.awake_ms)) lines.push(`Awake ${(d.awake_ms / 1000).toFixed(1)} s per wake-up`);
      if (has(d.fw_version)) lines.push(`Firmware ${esc(d.fw_version)}`);
    } else {
      lines.push("Sends no status. Its readings are under Rooms.");
    }
    const kind = (KIND[d.kind] || KIND.legacy)[1];
    return `<div class="item"><div class="text">
      <span class="head"><span class="label">${esc(d.name)}</span>${chip}</span>
      <span class="sub">${kind}</span>
      ${lines.map((line) => `<span class="sub">${line}</span>`).join("")}
    </div></div>`;
  }).join("");
}

// ---------- Message for the Hub ----------

// The Hub copies the bitmap to its screen as it is: 250 x 92 pixels, 1 bit each, rows padded to 32 bytes,
// most significant bit first, 1 = black. 2944 bytes, sent as 3928 characters of base64.
const MSG_W = 250, MSG_H = 92, MSG_STRIDE = 32;
const MSG_MARGIN = 8;         // left and right
const MSG_TEXT_TOP = 6;
const MSG_TEXT_BOTTOM = 77;   // the signature sits under this line
const MSG_FONTS = {
  hand:  { family: "Caveat", sizes: [44, 40, 36, 32, 28, 24, 22, 20, 18, 16], ascent: 0.8, descent: 0.25, line: 1.05 },
  print: { family: '"Familjen Grotesk"', sizes: [34, 30, 26, 22, 20, 18, 16, 14, 12], ascent: 0.76, descent: 0.22, line: 1.15 },
};
const PEN_PX = 2, ERASER_PX = 9;
const TOO_LONG = "Too long: the end is cut off. Shorten it or use fewer lines.";
const PAPER_RGB = [230, 229, 220], INK_RGB = [22, 20, 15];

const editor = {
  font: "hand", tool: "pen",
  strokes: [], stroke: null,                 // freehand: [{ erase, pts: [[x, y], ...] }]
  text: new Uint8Array(MSG_W * MSG_H),       // typed text and signature, 1 = black
  draw: new Uint8Array(MSG_W * MSG_H),       // freehand
  fits: true, opened: false, sending: false,
  bitmaps: new Map(),                        // message id -> base64, so a bitmap is downloaded once
};
const scratch = document.createElement("canvas");
scratch.width = MSG_W;
scratch.height = MSG_H;
const scratchCtx = scratch.getContext("2d", { willReadFrequently: true });

function signature() {
  const now = new Date();
  const time = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const name = $("msg-name").value.trim();
  return name ? `${name} · ${time}` : time;
}

// Breaks the text into lines no wider than maxWidth with the font already set on the context
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  for (const paragraph of text.split("\n")) {
    let line = "";
    for (let word of paragraph.split(/\s+/).filter(Boolean)) {
      const candidate = line ? line + " " + word : word;
      if (ctx.measureText(candidate).width <= maxWidth) { line = candidate; continue; }
      if (line) lines.push(line);
      // A single word wider than the screen is cut where it stops fitting
      while (ctx.measureText(word).width > maxWidth && word.length > 1) {
        let n = word.length - 1;
        while (n > 1 && ctx.measureText(word.slice(0, n)).width > maxWidth) n--;
        lines.push(word.slice(0, n));
        word = word.slice(n);
      }
      line = word;
    }
    lines.push(line);
  }
  return lines;
}

// Draws the typed text at the largest size that fits, then the signature, and keeps the result as 1-bit
function renderText() {
  const ctx = scratchCtx;
  ctx.clearRect(0, 0, MSG_W, MSG_H);
  ctx.fillStyle = "#000";
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";

  const f = MSG_FONTS[editor.font];
  const text = $("msg-text").value.replace(/\s+$/, "");
  editor.fits = true;
  if (text.trim()) {
    let size, lines;
    for (size of f.sizes) {
      ctx.font = `700 ${size}px ${f.family}`;
      lines = wrapText(ctx, text, MSG_W - 2 * MSG_MARGIN);
      editor.fits = MSG_TEXT_TOP + size * (f.ascent + (lines.length - 1) * f.line + f.descent) <= MSG_TEXT_BOTTOM;
      if (editor.fits) break;
    }
    lines.forEach((line, i) => ctx.fillText(line, MSG_MARGIN, Math.round(MSG_TEXT_TOP + size * (f.ascent + i * f.line))));
    if (!editor.fits) ctx.clearRect(0, MSG_TEXT_BOTTOM, MSG_W, MSG_H - MSG_TEXT_BOTTOM);  // keep the signature readable
  }

  ctx.font = "8px Tiny5, monospace";
  ctx.textAlign = "right";
  ctx.fillText(signature(), MSG_W - MSG_MARGIN, MSG_H - 5);

  // Black where the canvas is covered and dark, which text always is. A colour emoji keeps its darker
  // parts and gets an outline, so a pale one does not vanish and a face does not become a blob.
  const px = ctx.getImageData(0, 0, MSG_W, MSG_H).data;
  const covered = (x, y) => x >= 0 && x < MSG_W && y >= 0 && y < MSG_H && px[(y * MSG_W + x) * 4 + 3] >= 128;
  for (let y = 0; y < MSG_H; y++) {
    for (let x = 0; x < MSG_W; x++) {
      const i = y * MSG_W + x;
      const light = 0.3 * px[i * 4] + 0.59 * px[i * 4 + 1] + 0.11 * px[i * 4 + 2];
      const edge = !covered(x - 1, y) || !covered(x + 1, y) || !covered(x, y - 1) || !covered(x, y + 1);
      editor.text[i] = covered(x, y) && (light < 150 || edge) ? 1 : 0;
    }
  }
  paintEditor();
  // Only the warning is managed here: a "Sent" or an error stays until the next one
  if (!editor.fits) setMessageStatus(TOO_LONG, true);
  else if ($("msg-status").textContent === TOO_LONG) setMessageStatus("");
}

// A square of the tool's size at every pixel of the line from a to b
function strokeSegment(a, b, erase) {
  const size = erase ? ERASER_PX : PEN_PX;
  const offset = Math.floor((size - 1) / 2);
  let [x, y] = a;
  const dx = Math.abs(b[0] - x), dy = -Math.abs(b[1] - y);
  const sx = x < b[0] ? 1 : -1, sy = y < b[1] ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    for (let j = y - offset; j < y - offset + size; j++) {
      if (j < 0 || j >= MSG_H) continue;
      for (let i = x - offset; i < x - offset + size; i++) {
        if (i >= 0 && i < MSG_W) editor.draw[j * MSG_W + i] = erase ? 0 : 1;
      }
    }
    if (x === b[0] && y === b[1]) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x += sx; }
    if (e2 <= dx) { err += dx; y += sy; }
  }
}

function redrawStrokes() {
  editor.draw.fill(0);
  for (const s of editor.strokes) {
    for (let i = 0; i < s.pts.length; i++) strokeSegment(s.pts[Math.max(0, i - 1)], s.pts[i], s.erase);
  }
}

function paintBits(canvas, isBlack) {
  const ctx = canvas.getContext("2d");
  const image = ctx.createImageData(MSG_W, MSG_H);
  for (let i = 0; i < MSG_W * MSG_H; i++) {
    const rgb = isBlack(i) ? INK_RGB : PAPER_RGB;
    image.data[i * 4] = rgb[0];
    image.data[i * 4 + 1] = rgb[1];
    image.data[i * 4 + 2] = rgb[2];
    image.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

function paintEditor() {
  paintBits($("msg-canvas"), (i) => editor.text[i] || editor.draw[i]);
}

function packMessage() {
  const bytes = new Uint8Array(MSG_STRIDE * MSG_H);
  for (let y = 0; y < MSG_H; y++) {
    for (let x = 0; x < MSG_W; x++) {
      if (editor.text[y * MSG_W + x] || editor.draw[y * MSG_W + x]) bytes[y * MSG_STRIDE + (x >> 3)] |= 0x80 >> (x & 7);
    }
  }
  return btoa(String.fromCharCode(...bytes));
}

function paintMessage(canvas, base64) {
  let bytes;
  try { bytes = atob(base64); } catch (err) { return; }
  if (bytes.length !== MSG_STRIDE * MSG_H) return;
  paintBits(canvas, (i) => bytes.charCodeAt(Math.floor(i / MSG_W) * MSG_STRIDE + ((i % MSG_W) >> 3)) & (0x80 >> ((i % MSG_W) & 7)));
}

function setMessageStatus(text, isError) {
  $("msg-status").className = isError ? "msg error" : "msg";
  $("msg-status").textContent = text;
}

function initEditor() {
  const canvas = $("msg-canvas");
  const point = (e) => {
    const box = canvas.getBoundingClientRect();
    const clamp = (v, max) => Math.max(0, Math.min(max, Math.floor(v)));
    return [clamp((e.clientX - box.left) * MSG_W / box.width, MSG_W - 1), clamp((e.clientY - box.top) * MSG_H / box.height, MSG_H - 1)];
  };
  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* the stroke still works while the pointer stays on the canvas */ }
    const p = point(e);
    editor.stroke = { erase: editor.tool === "erase", pts: [p] };
    editor.strokes.push(editor.stroke);
    strokeSegment(p, p, editor.stroke.erase);
    paintEditor();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!editor.stroke) return;
    const p = point(e);
    const last = editor.stroke.pts[editor.stroke.pts.length - 1];
    if (p[0] === last[0] && p[1] === last[1]) return;
    editor.stroke.pts.push(p);
    strokeSegment(last, p, editor.stroke.erase);
    paintEditor();
  });
  const endStroke = () => { editor.stroke = null; };
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);

  $("msg-text").addEventListener("input", renderText);
  $("msg-name").addEventListener("input", () => {
    try { localStorage.setItem("hs-name", $("msg-name").value.trim()); } catch (err) { /* private window: not remembered */ }
    renderText();
  });
  document.querySelectorAll(".tools [data-font]").forEach((btn) => btn.addEventListener("click", () => {
    editor.font = btn.dataset.font;
    document.querySelectorAll(".tools [data-font]").forEach((b) => b.classList.toggle("on", b === btn));
    renderText();
  }));
  document.querySelectorAll(".tools [data-tool]").forEach((btn) => btn.addEventListener("click", () => {
    editor.tool = btn.dataset.tool;
    document.querySelectorAll(".tools [data-tool]").forEach((b) => b.classList.toggle("on", b === btn));
  }));
  $("msg-undo").addEventListener("click", () => {
    editor.strokes.pop();
    redrawStrokes();
    paintEditor();
  });
  $("msg-clear").addEventListener("click", clearEditor);
  $("msg-send").addEventListener("click", sendMessage);
  $("msg-list").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-clear]");
    if (!btn) return;
    btn.disabled = true;
    const { error } = await db.rpc("clear_message", { p_id: Number(btn.dataset.clear) });
    if (error) showBanner("Couldn't remove the message: " + error.message);
    refresh();
  });
  // The signature carries the time, so the preview follows the clock
  setInterval(() => { if (state.view === "message" && !editor.sending) renderText(); }, 20e3);
}

function clearEditor() {
  $("msg-text").value = "";
  editor.strokes = [];
  document.querySelector('.tools [data-tool="pen"]').click();
  redrawStrokes();
  renderText();
}

function openEditor() {
  if (!editor.opened) {
    editor.opened = true;
    try { $("msg-name").value = localStorage.getItem("hs-name") || ""; } catch (err) { /* no storage */ }
    // Canvas text falls back to another font until these two have loaded
    Promise.all([document.fonts.load("700 30px Caveat"), document.fonts.load('700 30px "Familjen Grotesk"'), document.fonts.load("8px Tiny5")])
      .then(renderText, renderText);
  }
  renderText();
}

async function sendMessage() {
  if (editor.sending) return;
  if (!$("msg-text").value.trim() && !editor.draw.includes(1)) return setMessageStatus("Write or draw something first.", true);
  editor.sending = true;
  $("msg-send").disabled = true;
  setMessageStatus("Sending…");
  renderText();  // the signature gets the time of sending
  const { error } = await db.from("messages").insert({ bitmap: packMessage() });
  editor.sending = false;
  $("msg-send").disabled = false;
  if (error) return setMessageStatus("Not sent: " + error.message, true);
  clearEditor();
  setMessageStatus("Sent. It shows on the Hub the next time it wakes.");
  refresh();
}

async function refreshMessages() {
  const { data, error } = await db.from("messages").select("id, created_at, author_email, read_at, cleared_at")
    .order("id", { ascending: false }).limit(6);
  if (error) throw error;
  const missing = data.filter((m) => !editor.bitmaps.has(m.id)).map((m) => m.id);
  if (missing.length) {
    const res = await db.from("messages").select("id, bitmap").in("id", missing);
    if (res.error) throw res.error;
    for (const m of res.data) editor.bitmaps.set(m.id, m.bitmap);
  }
  if (state.view !== "message") return;

  // The Hub shows the newest message only, and only until it is removed
  const hubSeen = state.devices.filter((d) => d.kind === "hub" && has(d.last_seen_at)).map((d) => new Date(d.last_seen_at).getTime());
  const hubLast = hubSeen.length ? Math.max(...hubSeen) : 0;
  $("msg-list").innerHTML = data.length ? data.map((m, i) => {
    const current = i === 0 && !m.cleared_at;
    let chip;
    if (m.read_at) chip = `<span class="chip good">Seen ${clock(m.read_at)}</span>`;
    else if (!current) chip = `<span class="chip">Not seen</span>`;
    else if (hubLast > new Date(m.created_at).getTime()) chip = `<span class="chip good">On the Hub</span>`;
    else chip = `<span class="chip fair">Waiting for the Hub</span>`;
    const where = m.cleared_at ? "Removed from the Hub" : current ? (m.read_at ? "Still on the Hub" : "A key press on the Hub marks it seen") : "Replaced by a newer one";
    return `<div class="item">
      <canvas class="paper" width="${MSG_W}" height="${MSG_H}" data-id="${m.id}" role="img" aria-label="Message sent ${clock(m.created_at)}"></canvas>
      <div class="text">
        <span class="head">${chip}</span>
        <span class="sub">Sent ${clock(m.created_at)} · ${esc(String(m.author_email).split("@")[0])}</span>
        <span class="sub">${where}</span>
        ${current ? `<button data-clear="${m.id}">Remove from the Hub</button>` : ""}
      </div>
    </div>` ;
  }).join("") : `<p class="muted">Nothing sent yet.</p>`;
  $("msg-list").querySelectorAll("canvas").forEach((c) => paintMessage(c, editor.bitmaps.get(Number(c.dataset.id)) || ""));
}

function showBanner(text) {
  $("banner").textContent = text;
  $("banner").hidden = false;
}
</script>
